name: Validate Fe workspace artifacts
on:
  push:
    branches: [feat/viewer-prover-workspace, feat/private-circle-proof]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify sources and complete compiled site
        run: python3 tools/site.py --out dist
      - name: Check exact point selection
        run: node tests/proof-selection.mjs
      - name: Check Fe/Wasm verifier against captured proofs and mutations
        run: node tests/fe-verifier.mjs
      - name: Execute certified Fe Wasm arithmetic against independent endpoints
        run: node tests/certified-escape.mjs
      - name: Check independent interval and algebraic models
        run: python3 -m unittest discover -s experiments/private_circle -v
      - name: Exercise certified deep-offset arithmetic and Unknown outcomes
        run: python3 experiments/private_circle/depth_probe.py
